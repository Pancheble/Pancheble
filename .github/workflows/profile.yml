name: profile cards
on:
  # 매일 00:00·12:00 KST (UTC 15시·3시). 오전·오후 그림이 이때 바뀜
  schedule: [{ cron: '0 15 * * *' }, { cron: '0 3 * * *' }]
  workflow_dispatch:
  push: { branches: [main], paths: [gen.mjs, 'images/**'] }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node gen.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add assets README.md
          git diff --cached --quiet || (git commit -m "update profile cards" && git push)
